<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구독 청구 금액 안내서 만들기</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#f3f3f5;color:#222;font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
h1{font-size:20px;margin:0;padding:16px;text-align:center}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 24px;display:grid;grid-template-columns:1fr 340px;gap:14px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002}
canvas{width:100%;height:auto;display:block;border-radius:6px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
input,select{width:100%;padding:12px;font-size:17px;border:1px solid #bbb;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.full{grid-column:1/-1}
button{width:100%;padding:14px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:#a50034;color:#fff;margin-top:10px}
button.sub{background:#555}
.hint{font-size:12px;color:#777;margin-top:8px;line-height:1.5}
.ex{background:#f7f2ee;padding:8px;border-radius:8px;font-size:13px;margin-top:10px}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;font-size:16px;margin:6px 0}.ck input{width:22px;height:22px;padding:0}.hidden{display:none}</style></head><body>
<h1>구독 청구 금액 안내서</h1>
<div class="wrap">
 <div class="card"><canvas id="cv" width="753" height="1068"></canvas></div>
 <div class="card">
  <b>금액 입력 (숫자만)</b>
  <label>① 월 구독료 (카드 결제)</label>
  <input id="a" inputmode="numeric" placeholder="예) 30000">
  <label>② 제휴카드 청구할인</label>
  <input id="b" inputmode="numeric" placeholder="예) 17000">
  <label>③ 실제 출금 금액 (자동계산)</label>
  <input id="c" inputmode="numeric" placeholder="자동계산 (직접 수정 가능)">
  <label>제휴카드 선택 (중복 선택 가능)</label><div id="cards"><label class="ck"><input type="checkbox" value="0"> LG전자 신한카드</label><label class="ck"><input type="checkbox" value="1"> LG전자 롯데카드</label><label class="ck"><input type="checkbox" value="2"> LG전자 우리카드</label><label class="ck"><input type="checkbox" value="3"> LG전자 국민카드</label></div>
  <div class="ex">예시 칸에는 위 3개 금액이 그대로 표시됩니다.</div>
 </div>
 <div class="card full">
  <label style="margin-top:0">고객 전화번호</label>
  <input id="tel" type="tel" inputmode="tel" placeholder="010-0000-0000">
  <button id="send">📩 이미지 첨부해서 문자 보내기</button><button id="sms" class="sub">💬 번호 입력된 문자창 열기 (글자만)</button><button id="save" class="sub" style="background:#888">💾 이미지 저장</button>
  <div id="status" style="display:none;margin-top:10px;font-weight:700;font-size:14px"></div><div id="outbox" style="display:none;margin-top:10px"><img id="out" style="width:100%;border-radius:6px" alt="완성 이미지"><div class="hint">이미지를 길게 누르면 저장/복사할 수 있어요. 문자 앱에서 붙여넣기 하세요.</div></div><div class="hint hidden">‘문자 보내기’를 누르면 휴대폰 문자앱이 열리며 고객 번호가 입력되고, 이미지 전송 화면이 함께 뜹니다. 이미지가 첨부 안 되면 ‘이미지 저장’ 후 문자에 첨부해 주세요. (완전 자동 발송은 문자 발송 서비스 가입이 필요합니다)</div>
 </div>
</div>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const img=new Image();let ready=false;
img.onload=()=>{ready=true;draw()};img.src=IMG;
const num=v=>{const n=parseInt(String(v).replace(/\D/g,''),10);return isNaN(n)?null:n};
const fmt=n=>n===null?'':n.toLocaleString('ko-KR');
function BG(x,y){const p=ctx.getImageData(x+1,y+1,1,1).data;return `rgb(${p[0]},${p[1]},${p[2]})`}
function cover(x,y,w,h){ctx.fillStyle=BG(x,y);ctx.fillRect(x,y,w,h)}
function txt(t,x,y,size,color){ctx.font=`bold ${size}px "Noto Sans KR","Malgun Gothic",sans-serif`;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(){
 if(!ready)return;
 ctx.drawImage(img,0,0);
 const A=num($('a').value),B=num($('b').value);let C=num($('c').value);
 if(A!==null&&B!==null&&!$('c').dataset.manual){C=A-B;$('c').value=C}
 const f=n=>fmt(n)+'원';
 [[225,370,A],[405,545,B],[580,715,C]].forEach(([x0,x1,v])=>{
  if(v===null)return;
  cover(x0,838,x1-x0,34);
  txt(f(v),(x0+x1)/2,855,26,'#222');
 });
 [[160,285,A],[355,480,B],[575,700,C]].forEach(([x0,x1,v])=>{
  if(v===null)return;
  cover(x0,984,x1-x0,32);
  txt(f(v),(x0+x1)/2,1000,26,'#222');
 });
 document.querySelectorAll('#cards input:checked').forEach(c=>{
  const y=[740,760,779,799][+c.value];
  ctx.strokeStyle='#d0021b';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(528,y);ctx.lineTo(533,y+6);ctx.lineTo(542,y-8);ctx.stroke();
 });
}
['a','b'].forEach(i=>$(i).addEventListener('input',()=>{$('c').dataset.manual='';draw()}));document.querySelectorAll('#cards input').forEach(c=>c.addEventListener('change',draw));
$('c').addEventListener('input',()=>{$('c').dataset.manual='1';draw()});
['a','b','c'].forEach(i=>$(i).addEventListener('blur',e=>{const n=num(e.target.value);if(n!==null)e.target.value=n}));
function blob(){return new Promise(r=>cv.toBlob(r,'image/png'))}
function msg(){const A=num($('a').value),B=num($('b').value),C=num($('c').value);
 return `[LG전자 구독 청구 금액 안내]\n월 구독료(카드결제): ${fmt(A)}원\n제휴카드 청구할인: ${fmt(B)}원\n실제 출금금액: ${fmt(C)}원\n※ 할인은 카드 청구 시 적용되며, 카드 문자/앱에는 할인 전 금액이 표시됩니다.\n문의: LG전자 고객센터 1544-7777`}
function say(m,bad){const e=$('status');e.textContent=m;e.style.color=bad?'#c00':'#06703a';e.style.display='block'}
function tel(){const t=$('tel').value.replace(/\D/g,'');if(t.length<10){say('고객 전화번호를 입력해 주세요.',1);return null}return t}
function showResult(){$('out').src=cv.toDataURL('image/png');$('outbox').style.display='block'}
async function dl(){const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='구독청구금액안내서.png';document.body.appendChild(a);a.click();a.remove()}
$('save').onclick=async()=>{showResult();try{await dl()}catch(e){}say('저장됐어요. 안 되면 아래 이미지를 길게 눌러 [이미지 저장]을 선택하세요.');$('outbox').scrollIntoView({behavior:'smooth'})};
$('sms').onclick=()=>{const t=tel();if(!t)return;showResult();say('문자창을 엽니다. (이미지는 첨부되지 않아요)');location.href='sms:'+t+'?&body='+encodeURIComponent(msg())};
$('send').onclick=async()=>{
 const t=tel();if(!t)return;
 showResult();
 try{
  const b=await blob();const file=new File([b],'구독청구금액안내서.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.clipboard.writeText(t)}catch(e){}
   say('공유 창에서 [메시지]를 선택하고, 받는 사람에 고객 번호('+t+')를 입력/붙여넣기 하세요.');
   await navigator.share({files:[file],text:msg()});return;
  }
 }catch(e){if(e&&e.name==='AbortError')return}
 say('이 휴대폰에서는 바로 첨부가 안 돼요. 아래 이미지를 길게 눌러 저장/복사 후 문자에 붙여넣기 하세요.',1);
};
