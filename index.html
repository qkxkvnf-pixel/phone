<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구독 청구 금액 안내서 만들기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f5;color:#222;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1{font-size:20px;margin:0;padding:16px;text-align:center}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 24px;display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002}
canvas{width:100%;height:auto;display:block;border-radius:6px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
input[type=text],input[type=tel]{width:100%;padding:12px;font-size:17px;border:1px solid #bbb;border-radius:8px}
.full{grid-column:1/-1}
button{width:100%;padding:14px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:#a50034;color:#fff;margin-top:10px}
button.sub{background:#888}
.hint{font-size:12px;color:#777;margin-top:8px;line-height:1.5}
.ex{background:#f7f2ee;padding:8px;border-radius:8px;font-size:13px;margin-top:10px}
table.ck{width:100%;border-collapse:collapse;margin-top:4px}
table.ck th{font-size:12px;color:#777;font-weight:400;text-align:center;padding:2px 0}
table.ck td{padding:7px 0;font-size:15px;border-top:1px solid #eee}
table.ck td.c{text-align:center;width:64px}
table.ck input{width:24px;height:24px}
</style></head><body>
<h1>구독 청구 금액 안내서</h1>
<div class="wrap">
 <div class="card"><canvas id="cv" width="1125" height="1608"></canvas></div>
 <div class="card">
  <b>금액 입력 (숫자만)</b>
  <label>① 월 구독료 (카드 결제)</label>
  <input id="a" type="text" inputmode="numeric" placeholder="예) 50000">
  <label>② 제휴카드 청구할인</label>
  <input id="b" type="text" inputmode="numeric" placeholder="예) 17000">
  <label>③ 실제 출금 금액 (자동계산)</label>
  <input id="c" type="text" inputmode="numeric" placeholder="자동계산 (직접 수정 가능)">
  <label>제휴카드 체크 (칸마다 중복 선택 가능)</label>
  <table class="ck" id="cards">
   <tr><th></th><th>왼쪽 칸</th><th>오른쪽 칸</th></tr>
   <tr><td>LG전자 신한카드</td><td class="c"><input type="checkbox" data-r="0" data-k="0"></td><td class="c"><input type="checkbox" data-r="0" data-k="1"></td></tr>
   <tr><td>LG전자 롯데카드</td><td class="c"><input type="checkbox" data-r="1" data-k="0"></td><td class="c"><input type="checkbox" data-r="1" data-k="1"></td></tr>
   <tr><td>LG전자 우리카드</td><td class="c"><input type="checkbox" data-r="2" data-k="0"></td><td class="c"><input type="checkbox" data-r="2" data-k="1"></td></tr>
   <tr><td>LG전자 국민카드</td><td class="c"><input type="checkbox" data-r="3" data-k="0"></td><td class="c"><input type="checkbox" data-r="3" data-k="1"></td></tr>
  </table>
  <label>내 연락처 (문자 맨 아래에 표시 · 한 번 입력하면 저장)</label>
  <input id="me" type="tel" inputmode="tel" placeholder="010-0000-0000">
  <div class="ex">하단 예시 칸에도 위 3개 금액이 그대로 표시됩니다.</div>
 </div>
 <div class="card full">
  <button id="send">📩 이미지 첨부해서 문자 보내기</button>
  <button id="save" class="sub">💾 이미지 저장</button>
  <div id="status" style="display:none;margin-top:10px;font-weight:700;font-size:14px"></div>
  <div id="outbox" style="display:none;margin-top:10px"><img id="out" style="width:100%;border-radius:6px" alt="완성 이미지"><div class="hint">이미지를 길게 누르면 저장/복사할 수 있어요.</div></div>
 </div>
</div>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const img=new Image();let ready=false;
img.onload=()=>{ready=true;draw()};img.src=IMG;
const num=v=>{const n=parseInt(String(v).replace(/\D/g,''),10);return isNaN(n)?null:n};
const fmt=n=>n===null?'':n.toLocaleString('ko-KR');
const FONT='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
function px(x,y){const p=ctx.getImageData(x,y,1,1).data;return `rgb(${p[0]},${p[1]},${p[2]})`}
function txt(t,x,y,size,color){ctx.font=`bold ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(){
 if(!ready)return;
 ctx.drawImage(img,0,0);
 const A=num($('a').value),B=num($('b').value);let C=num($('c').value);
 if(A!==null&&B!==null&&!$('c').dataset.manual){C=A-B;$('c').value=C}
 const f=n=>fmt(n)+'원';
 // 하단 괄호 칸 3곳 (베이지 알약 영역)
 [[329,530,A],[588,791,B],[849,1052,C]].forEach(([x0,x1,v])=>{
  if(v===null)return;
  ctx.fillStyle=px(x0+22,955);ctx.fillRect(x0+6,956,x1-x0-11,33);
  txt(f(v),(x0+x1)/2,973,30,'#222');
 });
 // 하단 예시 3곳
 [[355,510,A,'#111'],[600,757,B,'#111'],[870,1030,C,'#c8102e']].forEach(([x0,x1,v,col])=>{
  if(v===null)return;
  ctx.fillStyle=px(x0,1100);ctx.fillRect(x0,1096,x1-x0,38);
  txt(f(v),(x0+x1)/2,1116,36,col);
 });
 // 카드 체크 (카드마다 2칸)
 const ys=[841,864,887,910],xs=[769,790];
 document.querySelectorAll('#cards input:checked').forEach(c=>{
  const cx=xs[+c.dataset.k],cy=ys[+c.dataset.r];
  ctx.strokeStyle='#d0021b';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(cx-5,cy);ctx.lineTo(cx-1,cy+5);ctx.lineTo(cx+6,cy-6);ctx.stroke();
 });
}
['a','b'].forEach(i=>$(i).addEventListener('input',()=>{$('c').dataset.manual='';draw()}));
document.querySelectorAll('#cards input').forEach(c=>c.addEventListener('change',draw));
$('c').addEventListener('input',()=>{$('c').dataset.manual='1';draw()});
function blob(){return new Promise(r=>cv.toBlob(r,'image/png'))}
function phoneFmt(v){const d=String(v).replace(/\D/g,'').slice(0,11);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+'-'+d.slice(3);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7)}
function contact(){const d=$('me').value.replace(/\D/g,'');return d.length>=9?'\n문의: '+phoneFmt(d):''}
try{const sv=localStorage.getItem('guideMe');if(sv)$('me').value=sv}catch(e){}
$('me').addEventListener('input',()=>{try{localStorage.setItem('guideMe',$('me').value)}catch(e){}});
$('me').addEventListener('blur',()=>{$('me').value=phoneFmt($('me').value);try{localStorage.setItem('guideMe',$('me').value)}catch(e){}});
function msg(){const A=num($('a').value),B=num($('b').value),C=num($('c').value);
 return `[LG전자 구독 청구 금액 안내]\n월 구독료(카드결제): ${fmt(A)}원\n제휴카드 청구할인: ${fmt(B)}원\n실제 출금금액: ${fmt(C)}원\n※ 할인은 카드 청구 시 적용되며, 카드 문자/앱에는 할인 전 금액이 표시됩니다.${contact()}`}
function say(m,bad){const e=$('status');e.textContent=m;e.style.color=bad?'#c00':'#06703a';e.style.display='block'}
function ok(){if(num($('a').value)===null||num($('b').value)===null){say('월 구독료와 청구할인 금액을 먼저 입력해 주세요.',1);return false}return true}
function showResult(){$('out').src=cv.toDataURL('image/png');$('outbox').style.display='block'}
async function dl(){const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='구독청구금액안내서.png';document.body.appendChild(a);a.click();a.remove()}
$('save').onclick=async()=>{if(!ok())return;showResult();try{await dl()}catch(e){}say('저장됐어요. 안 되면 아래 이미지를 길게 눌러 [이미지 저장]을 선택하세요.');$('outbox').scrollIntoView({behavior:'smooth'})};
$('send').onclick=async()=>{
 if(!ok())return;
 showResult();
 try{
  const b=await blob();const file=new File([b],'구독청구금액안내서.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   say('공유 창에서 [메시지]를 선택하고, 받는 사람 칸에 고객 번호를 입력하세요.');
   await navigator.share({files:[file],text:msg()});return;
  }
 }catch(e){if(e&&e.name==='AbortError')return}
 say('이 휴대폰에서는 바로 첨부가 안 돼요. 아래 이미지를 길게 눌러 저장/복사 후 문자에 붙여넣기 하세요.',1);
};
